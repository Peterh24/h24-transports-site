<nav class="app-main-nav main-nav" [class.app-main-nav--open]="menuState$ | async" aria-label="Menu principal">
  <div class="main-nav__top">
    <app-logo></app-logo>
  </div>

  <div class="submenu">
    <ul class="submenu__list">
      <li *ngFor="let theme of themeList$ | async" class="submenu__item"
        [class.submenu__item--active]="(currentTheme$ | async)?.currentTheme == theme.id">
        <a [routerLink]="!theme.inPrenav ? ('/' + theme.id) : null" class="submenu__list__link"
          (click)="(theme.child.length === 0 && theme.inPrenav) ? switchTheme(theme.id) : null">{{ theme.title }}</a>
        <ul *ngIf="theme.child.length > 0">
          <li *ngFor="let child of theme.child"
            [class.submenu__item--active]="(currentTheme$ | async)?.child?.id == child.id">
            <a class="submenu__list__link" (click)="switchTheme(child.id)">{{ child.title }}</a>
          </li>
        </ul>
      </li>
    </ul>

    <ul class="anchor__list" *ngIf="(componentList$ | async).length > 0">
      <li *ngFor="let component of data">
        <a class="app-a anchor__list__link" (click)="goToAnchor(component.id)">{{ component.title }}</a>
      </li>
    </ul>

    <div class="main-nav__contact">
      <a class="main-nav__contact__row"
        href="https://maps.google.com/?q=4 Boulevard de Beaubourg 77183 Croissy Beaubourg"
        target="_blank" rel="noopener">
        <mat-icon aria-hidden="true">pin_drop</mat-icon>
        <span>4 Boulevard de Beaubourg<br>77183 Croissy Beaubourg</span>
      </a>
      <a class="main-nav__contact__row" href="tel:+33180275460">
        <mat-icon aria-hidden="true">phone</mat-icon>
        <span>+33 (0)1 80 27 54 60</span>
      </a>
      <a class="main-nav__contact__row" href="mailto:contact@h24transports.com">
        <mat-icon aria-hidden="true">mail_outline</mat-icon>
        <span>contact&#64;h24transports.com</span>
      </a>
    </div>
  </div>
</nav>

<div class="main-nav__backdrop" [class.main-nav__backdrop--open]="menuState$ | async" (click)="closeMenu()"></div>
